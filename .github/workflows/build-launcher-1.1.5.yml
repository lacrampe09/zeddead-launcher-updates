name: Build ZED'S DEAD Launcher 1.1.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-launcher-1.1.5.yml"
      - "release-input/1.1.5/**"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build launcher and update package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'bundle115'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $bundle,$dist -Force | Out-Null

          $baseZip = Join-Path $env:RUNNER_TEMP 'base-1.1.4.zip'
          Invoke-WebRequest 'https://github.com/lacrampe09/zeddead-launcher-updates/releases/download/v1.1.4/ZedsDeadLauncher-update-1.1.4.zip' -OutFile $baseZip
          Expand-Archive -LiteralPath $baseZip -DestinationPath $bundle -Force
          Copy-Item 'release-input/1.1.5/ZedsDeadLauncher.ps1' $bundle -Force
          Copy-Item 'release-input/1.1.5/launcher.config.json' $bundle -Force
          Copy-Item 'release-input/1.1.5/LauncherBootstrap.cs' $bundle -Force

          $resources = @(
            'ZedsDeadLauncher.ps1','Apply-LauncherUpdate.ps1','Launcher.xaml','launcher.config.json',
            'zeds-dead-background.png','zeds-dead-logo.png','zeds-dead-logo.ico','launcher-music.mp3'
          )
          $exe = Join-Path $dist 'ZedsDeadLauncher-1.1.5.exe'
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $arguments = @('/nologo','/target:winexe','/platform:anycpu','/optimize+','/reference:System.Windows.Forms.dll',('/win32icon:' + (Join-Path $bundle 'zeds-dead-logo.ico')),('/out:' + $exe))
          foreach ($name in $resources) { $arguments += ('/resource:' + (Join-Path $bundle $name) + ',' + $name) }
          $arguments += (Join-Path $bundle 'LauncherBootstrap.cs')
          & $csc @arguments
          if ($LASTEXITCODE -ne 0) { throw "Compilation échouée avec le code $LASTEXITCODE" }

          $zip = Join-Path $dist 'ZedsDeadLauncher-update-1.1.5.zip'
          $zipItems = $resources | ForEach-Object { Join-Path $bundle $_ }
          Compress-Archive -LiteralPath $zipItems -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          "ZIP_SHA256=$zipHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $update = [ordered]@{
            version = '1.1.5'
            downloadUrl = 'https://github.com/lacrampe09/zeddead-launcher-updates/releases/download/v1.1.5/ZedsDeadLauncher-update-1.1.5.zip'
            sha256 = $zipHash
            releaseNotes = 'Détection et installation automatiques des mises à jour de mods publiées sur GitHub.'
          }
          $update | ConvertTo-Json | Set-Content -LiteralPath 'update.json' -Encoding utf8NoBOM

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.5 dist/ZedsDeadLauncher-1.1.5.exe dist/ZedsDeadLauncher-update-1.1.5.zip --title "ZED'S DEAD Launcher 1.1.5" --notes "Le launcher consulte désormais la liste des mods à chaque ouverture, télécharge les versions nouvelles ou modifiées et vérifie leur empreinte SHA-256 avant installation." --prerelease

      - name: Publish update manifest
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m 'Publish launcher update 1.1.5'
          git push

